<style>
:root{--bg:#f4f7fb;--ink:#14243a;--muted:#6d7c90;--nav:#102338;--blue:#1764d8;--line:#dbe4ef;--white:#fff;--green:#137b56;--red:#be3d46;--gold:#ac6d0c;--radius:15px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,ui-sans-serif,system-ui,Segoe UI,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}header{background:var(--nav);color:#fff;padding:19px 28px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}header .brand{font-size:21px;font-weight:800;letter-spacing:.2px}.sub{font-size:12px;color:#bdd0df}.userctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,input,textarea{background:#fff;border:1px solid #c9d6e5;border-radius:9px;padding:10px 12px;width:100%;outline:none;color:var(--ink)}select:focus,input:focus,textarea:focus{border-color:#5196f5;box-shadow:0 0 0 3px #5196f522}header select{width:auto;min-width:175px}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:calc(100vh - 77px)}aside{background:white;border-right:1px solid var(--line);padding:20px 12px}.navbtn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 15px;margin:4px 0;border:0;background:transparent;border-radius:10px;color:#506277;font-weight:650}.navbtn.active,.navbtn:hover{background:#e9f1ff;color:#1459bc}main{padding:25px;min-width:0;max-width:1550px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:21px}h1{font-size:25px;margin:0 0 3px}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px}p{margin:4px 0}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:none;border-radius:9px;padding:10px 15px;font-weight:700;background:#e8eff9;color:#1c426d}.btn.primary{background:var(--blue);color:#fff}.btn.positive{background:var(--green);color:#fff}.btn.danger{background:var(--red);color:#fff}.btn.outline{border:1px solid var(--line);background:white}.btn:hover{filter:brightness(.96)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:#fff;border:1px solid var(--line);box-shadow:0 2px 12px #18385608;border-radius:var(--radius)}.stat{padding:18px}.stat .num{font-size:29px;font-weight:800;margin-top:8px}.stat .lbl{color:var(--muted);font-weight:600}.panel{padding:20px;margin-bottom:18px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input{max-width:290px}.toolbar select{max-width:215px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th,td{padding:13px 12px;border-bottom:1px solid #edf1f6;vertical-align:middle}th{font-size:12px;text-transform:uppercase;color:#718399;letter-spacing:.5px;background:#fafcff}tr:last-child td{border-bottom:0}tr:hover td{background:#fafcff}.badge{display:inline-block;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;background:#e7effc;color:#235ead}.badge.wait{background:#fff1d7;color:#946114}.badge.ok{background:#e0f5ec;color:#11734c}.badge.no{background:#fce8e9;color:#b22d38}.badge.edit{background:#e8ebf1;color:#596b7b}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field label{display:block;font-weight:700;font-size:12px;margin-bottom:5px;color:#42556d}.field small{color:var(--muted)}.full{grid-column:1/-1}.items-head,.itemrow{display:grid;grid-template-columns:minmax(0,2fr) 90px 155px 155px 42px;gap:9px;align-items:center;margin-bottom:9px}.items-head{font-size:12px;font-weight:700;color:var(--muted)}.itemrow .remove{border:0;background:#fee9ea;color:#bc3747;border-radius:8px;height:39px;font-weight:800}.right{text-align:right}.flex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.total{font-size:21px;font-weight:850}.timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:18px 0}.step{border:1px solid var(--line);border-radius:10px;padding:11px;background:#f9fbfd;position:relative}.step strong{display:block}.step.done{border-color:#9bdac4;background:#eaf9f2}.step.current{border-color:#eaca83;background:#fff9e9}.step.rejected{border-color:#efadb2;background:#fff0f0}.detailmeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.detailmeta div{background:#f8fafc;border:1px solid #e7edf4;padding:11px;border-radius:10px}.detailmeta b{display:block}.history{border-left:2px solid #d9e6f6;margin-left:7px;padding-left:18px}.event{position:relative;padding-bottom:14px}.event:before{content:'';position:absolute;top:5px;left:-24px;width:10px;height:10px;border:2px solid white;border-radius:50%;background:#4b86de;box-shadow:0 0 0 1px #b4c9e7}.notice{background:#fff8df;color:#815400;border:1px solid #e8d49a;border-radius:10px;padding:12px 15px;margin-bottom:18px}.hide{display:none!important}.empty{text-align:center;padding:45px 18px;color:var(--muted)}.separator{height:1px;background:var(--line);margin:20px 0}textarea{min-height:80px;resize:vertical}.modal{position:fixed;inset:0;background:#0c1b33a8;display:flex;justify-content:center;align-items:center;padding:15px;z-index:10}.modal>article{width:min(500px,100%);background:white;border-radius:16px;padding:22px;box-shadow:0 20px 65px #0003}.modal footer{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.pill{border-radius:8px;background:#e8f2fd;padding:3px 9px;color:#21569b;font-weight:700;font-size:12px}.attachment{word-break:break-all}.code{font-variant-numeric:tabular-nums}.print-only{display:none}@media(max-width:1000px){.layout{grid-template-columns:1fr}aside{display:flex;overflow-x:auto;padding:8px;border-bottom:1px solid var(--line);border-right:none}.navbtn{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.timeline{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){main{padding:14px}header{padding:15px}.grid2,.detailmeta{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:13px}.stat .num{font-size:23px}.items-head{display:none}.itemrow{grid-template-columns:1fr 1fr}.itemrow input:first-child{grid-column:1/-1}.itemrow .remove{grid-column:1/-1}.toolbar input,.toolbar select{max-width:none}.timeline{grid-template-columns:1fr}}@media print{header,aside,.no-print,.toolbar,.modal,.btn{display:none!important}.layout{display:block}main{padding:0}.panel{border:0;box-shadow:none;padding:8px}body{background:white}h1{font-size:18px}.print-only{display:block}.timeline{break-inside:avoid}}

[hidden]{display:none!important}
/* Tampilan login */
.login-screen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 12% 12%,#254d78 0%,transparent 35%),linear-gradient(140deg,#0b1c2e,#122e49 60%,#173b5e);overflow:auto}
.login-screen[hidden]{display:none!important}
.login-card{background:#fff;border-radius:22px;padding:38px;width:min(100%,440px);box-shadow:0 24px 80px #0005;text-align:center}
.login-mark{width:56px;height:56px;border-radius:16px;background:#e9f1ff;display:grid;place-items:center;font-size:30px;color:#185bb0;margin:0 auto 8px}
.login-brand{font-size:22px;font-weight:900;letter-spacing:1.8px;color:#142943}.login-subtitle{font-size:12px;color:#708196;margin:0 0 22px}
.login-card h1{font-size:24px;margin-bottom:6px}.login-card>.muted{margin-bottom:26px}
.login-card .field{text-align:left;display:block;margin-top:16px}.login-card .field>span{display:block;font-size:13px;font-weight:750;margin-bottom:6px}
.password-wrap{position:relative}.password-wrap input{padding-right:76px}.eye-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#edf2f9;border-radius:7px;padding:6px 10px;color:#244263;font-weight:700}
.login-error{min-height:20px;color:#b52d3b;font-size:12px;text-align:left;margin:10px 0 2px}.login-submit{width:100%;margin-top:8px;padding:13px}.login-foot{border-top:1px solid #e7edf5;padding-top:18px;margin-top:24px;color:#8291a3;font-size:11px}
@media(max-width:480px){.login-card{padding:28px 22px}.login-card h1{font-size:22px}}
@media print{#loginScreen{display:none!important}}
</style></head>
<body>
<header hidden><div><div class="brand">✦ TRANSWISATA <span style="font-weight:400">/ FUND REQUEST</span></div><div class="sub">Sistem Pengajuan Dana & Persetujuan Berjenjang</div></div><div class="userctrl"><span id="signedInAs" class="sub"></span><button class="btn outline" onclick="logout()">↪ Logout</button></div></header>
<div class="layout" id="appLayout" hidden><aside><button class="navbtn active" data-page="dashboard" onclick="switchPage('dashboard')">▦ Dashboard</button><button class="navbtn" data-page="list" onclick="switchPage('list')">▤ Seluruh Pengajuan</button><button class="navbtn" data-page="new" onclick="switchPage('new')">＋ Buat Pengajuan</button><button class="navbtn" data-page="settings" onclick="switchPage('settings')">⚙ Pengaturan & Data</button></aside><main id="main"></main></div>
<div id="modalRoot"></div>
<div id="loginScreen" class="login-screen">
 <div class="login-card">
  <div class="login-mark">✦</div>
  <div class="login-brand">TRANSWISATA</div>
  <p class="login-subtitle">PT. Transwisata Prima Aviation</p>
  <h1>Fund Request System</h1>
  <p class="muted">Masuk untuk mengajukan dana atau memproses persetujuan.</p>
  <form id="loginForm" onsubmit="return login(event)">
   <label class="field"><span>Username</span><input name="username" id="loginUsername" type="text" autocomplete="username" placeholder="Masukkan username" required></label>
   <label class="field"><span>Password</span><div class="password-wrap"><input name="password" id="loginPassword" type="password" autocomplete="current-password" placeholder="Masukkan password" required><button type="button" class="eye-btn" id="togglePassword" onclick="togglePasswordVisibility()" aria-label="Tampilkan password">Lihat</button></div></label>
   <p class="login-error" id="loginError" role="alert" aria-live="polite"></p>
   <button class="btn primary login-submit" type="submit">Masuk ke Aplikasi →</button>
  </form>
  <div class="login-foot">Pemohon → Operation Manager → Finance → Direktur</div>
 </div>
</div>
<script>
'use strict';
const STORE='twa_fund_requests_v1', SETTINGS='twa_fund_settings_v1';
const STAGES=['kepala','finance','direktur'];const roleName={pemohon:'Pemohon',kepala:'Operation Manager',finance:'Finance',direktur:'Direktur',admin:'Admin'};
const ACCOUNTS=Object.freeze({user:{password:'usertranswisata',role:'pemohon',label:'Pemohon / Staff'},manops:{password:'manopstwa',role:'kepala',label:'Operation Manager'},finance:{password:'financetwa',role:'finance',label:'Finance'},dirut:{password:'diruttwa',role:'direktur',label:'Direktur'}});
const SESSION_KEY='twa_fund_login_v1';let loginUsername='';
const statusName={draft:'Draft',kepala:'Menunggu Kepala Bagian',finance:'Menunggu Verifikasi Finance',direktur:'Menunggu Persetujuan Direktur',approved:'Disetujui Direktur',rejected:'Ditolak',revision:'Perlu Revisi'};
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const date=iso=>iso?new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(iso)):'—';
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let role='pemohon',page='dashboard',filter='all',search='',editing=null,detail=null;
const load=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return []}};
const save=a=>localStorage.setItem(STORE,JSON.stringify(a));
const cfg=()=>{try{return {...{company:'PT. Transwisata Prima Aviation',names:{pemohon:'Staff / Pemohon',kepala:'Operation Manager',finance:'Finance',direktur:'Direktur'}},...JSON.parse(localStorage.getItem(SETTINGS)||'{}')}}catch{return {company:'PT. Transwisata Prima Aviation',names:{pemohon:'Staff / Pemohon',kepala:'Operation Manager',finance:'Finance',direktur:'Direktur'}}}};
const currentName=()=>role==='pemohon'?(cfg().names?.pemohon||'Staff / Pemohon'):roleName[role];
const totals=r=>(r.items||[]).reduce((a,x)=>a+(Number(x.qty)||0)*(Number(x.price)||0),0);
const stageLabel=s=>statusName[s]||s;
const badge=s=>`<span class="badge ${s==='approved'?'ok':s==='rejected'?'no':s==='revision'?'edit':'wait'}">${escapeHtml(stageLabel(s))}</span>`;
const generateId=()=>{const y=new Date().getFullYear();const ids=load().filter(x=>x.id.startsWith('FR-'+y+'-')).map(x=>Number(x.id.split('-').pop())||0);return `FR-${y}-${String(Math.max(0,...ids)+1).padStart(4,'0')}`};
function switchPage(p){if(!loginUsername)return;if(p==='new'&&role!=='pemohon')return;if(p==='settings'&&role!=='pemohon')return;page=p;detail=null;editing=null;render()}
function navigateDetail(id){const x=load().find(z=>z.id===id);if(!x||(role==='pemohon'&&x.requester!==currentName())){alert('Pengajuan tidak dapat diakses.');return}detail=id;page='detail';render()}
function navActive(){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===(page==='detail'?'list':page)))}
function render(){if(!loginUsername)return;document.getElementById('signedInAs').textContent=ACCOUNTS[loginUsername].label+' · '+loginUsername;document.querySelector('[data-page="new"]').hidden=role!=='pemohon';document.querySelector('[data-page="settings"]').hidden=role!=='pemohon';navActive();const main=document.getElementById('main');main.innerHTML=page==='dashboard'?dashboard():page==='list'?listPage():page==='new'?formPage():page==='detail'?detailPage():settingsPage();if(page==='new')bindForm();if(page==='list')bindList()}
const header=(title,desc,button=false)=>`<div class="topbar"><div><h1>${title}</h1><p class="muted">${desc}</p></div>${button&&role==='pemohon'?'<button class="btn primary no-print" onclick="switchPage(\'new\')">＋ Pengajuan Baru</button>':''}</div>`;
function dashboard(){const data=load(),pending=data.filter(x=>x.status===role),approved=data.filter(x=>x.status==='approved'),mine=role==='pemohon'?data.filter(x=>x.requester===currentName()):data;let stat=[['Total Pengajuan',mine.length],['Menunggu Tindakan',pending.length],['Disetujui',approved.length],['Nilai Dana Disetujui',money(approved.reduce((a,x)=>a+totals(x),0))]];
return header('Dashboard Approval',`Halo, ${escapeHtml(currentName())}. Pantau alur pengajuan dana.`,true)+`<div class="notice">Mode demo lokal: login berlaku pada browser ini saja. Data belum tersinkronisasi antar perangkat. Untuk operasional resmi gunakan autentikasi dan persetujuan yang diverifikasi server.</div><div class="stats">${stat.map(([a,b])=>`<div class="stat"><div class="lbl">${a}</div><div class="num">${b}</div></div>`).join('')}</div><section class="panel"><div class="flex space"><h2>${role==='pemohon'?'Pengajuan Saya':role==='admin'?'Pengajuan Terbaru':'Menunggu Tindakan Saya'}</h2><button class="btn outline no-print" onclick="switchPage('list')">Lihat Semua</button></div>${table(role==='pemohon'?mine:role==='admin'?data:pending,7)}</section><section class="panel"><h2>Alur Persetujuan</h2><div class="timeline">${['Pemohon → Submit','1. Kepala Bagian','2. Finance (Cross-check)','3. Direktur (Final)'].map((x,i)=>`<div class="step"><strong>${x}</strong><span class="small muted">${['Buat pengajuan & rincian biaya','Tinjau urgensi dan kesesuaian kebutuhan','Verifikasi nominal, anggaran & dokumen','Approve / tolak keputusan akhir'][i]}</span></div>`).join('')}</div></section>`}
function table(rows,limit=0){const list=(limit?rows.slice(0,limit):rows);if(!list.length)return `<div class="empty">Belum ada pengajuan dalam kategori ini.</div>`;return `<div class="scroll"><table><thead><tr><th>No. Pengajuan</th><th>Tanggal</th><th>Judul / Keperluan</th><th>Pemohon</th><th>Total Dana</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${list.map(x=>`<tr><td><b class="code">${escapeHtml(x.id)}</b></td><td>${date(x.created)}</td><td><b>${escapeHtml(x.title)}</b><br><span class="small muted">${escapeHtml(x.department)}</span></td><td>${escapeHtml(x.requester)}</td><td><b>${money(totals(x))}</b></td><td>${badge(x.status)}</td><td><button class="btn" onclick="navigateDetail('${x.id}')">Detail →</button></td></tr>`).join('')}</tbody></table></div>`}
function listPage(){return header('Daftar Pengajuan','Cari, filter, dan proses seluruh permohonan dana.',true)+`<section class="panel"><div class="toolbar no-print"><input id="q" placeholder="Cari nomor, judul, pemohon..." value="${escapeHtml(search)}"><select id="filter"><option value="all">Semua Status</option>${Object.entries(statusName).map(([v,n])=>`<option value="${v}" ${filter===v?'selected':''}>${n}</option>`).join('')}</select><button class="btn outline" onclick="exportCSV()">↓ Export CSV</button></div><div id="listing">${table(filtered())}</div></section>`}
function filtered(){return load().filter(x=>(role!=='pemohon'||x.requester===currentName())&&(filter==='all'||x.status===filter)&&[x.id,x.title,x.requester,x.department].some(a=>String(a||'').toLowerCase().includes(search.toLowerCase())))}
function bindList(){document.getElementById('q').oninput=e=>{search=e.target.value;document.getElementById('listing').innerHTML=table(filtered())};document.getElementById('filter').onchange=e=>{filter=e.target.value;document.getElementById('listing').innerHTML=table(filtered())}}
function formPage(){const d=editing?load().find(x=>x.id===editing):null;return header(d?'Revisi Pengajuan':'Form Pengajuan Dana','Isi keperluan, rencana penggunaan dana, dan rincian biaya.')+`<form id="requestForm"><section class="panel"><h2>Informasi Pengajuan</h2><div class="grid2"><div class="field"><label>Nama Pemohon *</label><input name="requester" required maxlength="100" value="${escapeHtml(d?.requester||cfg().names?.pemohon||'')}"></div><div class="field"><label>Divisi / Bagian *</label><select name="department" required>${['','Operation','Maintenance','Finance','HRD & GA','Commercial','Management','Lainnya'].map(v=>`<option ${d?.department===v?'selected':''}>${escapeHtml(v)}</option>`).join('')}</select></div><div class="field full"><label>Judul / Keperluan Dana *</label><input name="title" required maxlength="180" placeholder="Contoh: Pembelian alat pendukung operasional" value="${escapeHtml(d?.title||'')}"></div><div class="field"><label>Tanggal Dana Dibutuhkan *</label><input type="date" name="needed" required value="${escapeHtml(d?.needed||new Date().toLocaleDateString('en-CA'))}"></div><div class="field"><label>Kategori</label><select name="category">${['Operasional','Maintenance','Training','Transportasi','Akomodasi','Pengadaan','Lainnya'].map(v=>`<option ${d?.category===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label>Penjelasan / Justifikasi *</label><textarea name="reason" required placeholder="Jelaskan kebutuhan, manfaat, lokasi, dan urgensi">${escapeHtml(d?.reason||'')}</textarea></div></div></section><section class="panel"><div class="flex space"><h2>Rincian Biaya</h2><button class="btn outline" type="button" onclick="addItem()">＋ Tambah Item</button></div><div class="items-head"><span>Uraian *</span><span>Qty *</span><span>Harga Satuan (IDR) *</span><span>Jumlah</span><span></span></div><div id="items"></div><div class="separator"></div><div class="flex space"><span class="muted">Total pengajuan dalam Rupiah</span><span class="total" id="grand">Rp0</span></div></section><section class="panel"><h2>Dokumen Pendukung</h2><div class="field"><label>Upload Lampiran (opsional, max 1 MB)</label><input id="upload" type="file" accept=".pdf,.jpg,.jpeg,.png"><small>Untuk demo lokal, satu lampiran kecil disimpan di browser; file yang lebih besar memerlukan storage server. ${d?.attachment?`Lampiran tersimpan: ${escapeHtml(d.attachment.name)}.`:''}</small></div></section><div class="flex no-print"><button class="btn primary" type="submit">${d?'Kirim Ulang Revisi':'Ajukan untuk Persetujuan'}</button><button type="button" class="btn outline" onclick="switchPage('list')">Batal</button></div></form>`}
function addItem(item={name:'',qty:1,price:0}){const el=document.createElement('div');el.className='itemrow';el.innerHTML=`<input class="itname" placeholder="Nama barang / biaya" required maxlength="180" value="${escapeHtml(item.name)}"><input class="itqty" type="number" min="0.01" step="0.01" required value="${Number(item.qty)||1}"><input class="itprice" type="number" min="0" step="1" required value="${Number(item.price)||0}"><input class="itsum" readonly aria-label="Jumlah item"><button type="button" class="remove" aria-label="Hapus item" title="Hapus item">×</button>`;el.querySelector('.remove').onclick=()=>{el.remove();calc()};el.querySelectorAll('input:not(.itsum)').forEach(x=>x.addEventListener('input',calc));document.getElementById('items').append(el);calc()}
function calc(){let total=0;document.querySelectorAll('.itemrow').forEach(r=>{const n=(Number(r.querySelector('.itqty').value)||0)*(Number(r.querySelector('.itprice').value)||0);r.querySelector('.itsum').value=money(n);total+=n});document.getElementById('grand').textContent=money(total)}
function bindForm(){const d=editing?load().find(x=>x.id===editing):null;(d?.items||[{name:'',qty:1,price:0}]).forEach(addItem);document.getElementById('requestForm').onsubmit=submitForm}
async function submitForm(e){e.preventDefault();if(role!=='pemohon'||!loginUsername){alert('Hanya pemohon yang dapat mengajukan dana.');return;}const f=e.target,fd=new FormData(f),items=[...document.querySelectorAll('.itemrow')].map(r=>({name:r.querySelector('.itname').value.trim(),qty:Number(r.querySelector('.itqty').value),price:Number(r.querySelector('.itprice').value)}));if(!items.length||items.some(x=>!x.name||x.qty<=0||x.price<0)){alert('Masukkan setidaknya satu rincian biaya yang valid.');return}const old=editing?load().find(x=>x.id===editing):null;let att=old?.attachment||null;const file=document.getElementById('upload').files[0];if(file){if(file.size>1024*1024){alert('Lampiran melebihi 1 MB. Gunakan berkas lebih kecil pada versi demo.');return}att=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,data:reader.result});reader.onerror=reject;reader.readAsDataURL(file)})}const now=new Date().toISOString();const obj={...(old||{}),id:old?.id||generateId(),created:old?.created||now,updated:now,requester:String(fd.get('requester')).trim(),department:String(fd.get('department')),title:String(fd.get('title')).trim(),needed:String(fd.get('needed')),category:String(fd.get('category')),reason:String(fd.get('reason')).trim(),items,attachment:att,status:'kepala',history:[...(old?.history||[]),{at:now,by:roleName[role],name:currentName(),action:old?'Pengajuan diperbaiki & dikirim ulang':'Pengajuan dibuat & diajukan',note:''}]};const data=load();if(old){const i=data.findIndex(x=>x.id===old.id);data[i]=obj}else data.unshift(obj);try{save(data)}catch{alert('Penyimpanan browser penuh. Coba lampiran yang lebih kecil atau ekspor dan bersihkan data.');return}editing=null;navigateDetail(obj.id)}
function editRequest(id){if(role!=='pemohon')return;const x=load().find(z=>z.id===id);if(!x||x.status!=='revision'||x.requester!==currentName()){alert('Hanya pengajuan milik Anda yang berstatus Perlu Revisi yang dapat diubah.');return}editing=id;page='new';render()}
function timeline(x){let idx=STAGES.indexOf(x.status);return `<div class="timeline">${STAGES.map((s,i)=>{const h=(x.history||[]).some(y=>y.stage===s&&y.action==='Setujui');const state=x.status==='rejected'&&x.rejectedAt===s?'rejected':h?'done':x.status===s?'current':'';return `<div class="step ${state}"><strong>${i+1}. ${roleName[s]}</strong><span class="small">${state==='done'?'✓ Selesai':state==='current'?'● Menunggu tindakan':state==='rejected'?'✕ Ditolak':'Belum diproses'}</span></div>`}).join('')}<div class="step ${x.status==='approved'?'done':''}"><strong>4. Final</strong><span class="small">${x.status==='approved'?'✓ Approved':stageLabel(x.status)}</span></div></div>`}
function detailPage(){const x=load().find(r=>r.id===detail);if(!x)return `<div class="panel">Pengajuan tidak ditemukan. <button class="btn" onclick="switchPage('list')">Kembali</button></div>`;let can=role===x.status&&STAGES.includes(role);const canRev=x.status==='revision'&&role==='pemohon'&&x.requester===currentName();return header(`Pengajuan ${escapeHtml(x.id)}`,`Dibuat ${date(x.created)} · Terakhir diperbarui ${date(x.updated)}`)+`<section class="panel"><div class="flex space"><h2>${escapeHtml(x.title)}</h2>${badge(x.status)}</div>${timeline(x)}<div class="detailmeta"><div><span class="small muted">Pemohon</span><b>${escapeHtml(x.requester)}</b></div><div><span class="small muted">Bagian / Divisi</span><b>${escapeHtml(x.department)}</b></div><div><span class="small muted">Tanggal Dibutuhkan</span><b>${escapeHtml(x.needed)}</b></div><div><span class="small muted">Kategori</span><b>${escapeHtml(x.category)}</b></div><div><span class="small muted">Nominal Dana</span><b>${money(totals(x))}</b></div><div><span class="small muted">Status</span><b>${escapeHtml(stageLabel(x.status))}</b></div></div><div class="separator"></div><h3>Penjelasan Kebutuhan</h3><p style="white-space:pre-wrap">${escapeHtml(x.reason)}</p></section><section class="panel"><h2>Rincian Anggaran</h2><div class="scroll"><table><thead><tr><th>Uraian</th><th>Qty</th><th>Harga Satuan</th><th>Jumlah</th></tr></thead><tbody>${x.items.map(i=>`<tr><td>${escapeHtml(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td><b>${money(i.qty*i.price)}</b></td></tr>`).join('')}</tbody></table></div><div class="right total" style="padding-top:15px">Total: ${money(totals(x))}</div>${x.attachment?`<div class="separator"></div><a class="attachment" href="${x.attachment.data}" download="${escapeHtml(x.attachment.name)}">📎 ${escapeHtml(x.attachment.name)} (unduh lampiran)</a>`:''}</section><section class="panel"><h2>Riwayat & Audit Persetujuan</h2><div class="history">${(x.history||[]).slice().reverse().map(h=>`<div class="event"><b>${escapeHtml(h.action)}</b><div class="small muted">${date(h.at)} · ${escapeHtml(h.name)} (${escapeHtml(h.by)})</div>${h.note?`<p>${escapeHtml(h.note)}</p>`:''}</div>`).join('')}</div></section>${can?`<section class="panel no-print"><h2>Keputusan ${roleName[role]}</h2><p class="muted">${role==='finance'?'Periksa rincian biaya, kesesuaian anggaran, dan bukti pendukung sebelum meneruskan ke Direktur.':'Tuliskan alasan atau catatan apabila diperlukan.'}</p><label class="field"><span>Catatan Persetujuan / Verifikasi</span><textarea id="decisionNote" placeholder="Contoh: Anggaran sesuai dan dokumen telah diverifikasi"></textarea></label><div class="flex" style="margin-top:12px"><button class="btn positive" onclick="decision('approve')">✓ ${role==='finance'?'Verifikasi & Teruskan':role==='direktur'?'Setujui Final':'Setujui & Teruskan'}</button><button class="btn outline" onclick="decision('revision')">↶ Minta Revisi</button><button class="btn danger" onclick="decision('reject')">✕ Tolak</button></div></section>`:''}${canRev?`<section class="panel no-print"><button class="btn primary" onclick="editRequest('${x.id}')">✎ Perbaiki & Ajukan Kembali</button></section>`:''}<div class="flex no-print" style="padding:4px 0 20px"><button class="btn outline" onclick="switchPage('list')">← Kembali</button><button class="btn outline" onclick="window.print()">⎙ Cetak / Simpan PDF</button></div>`}
function decision(kind){if(!loginUsername||!STAGES.includes(role))return;const note=document.getElementById('decisionNote')?.value.trim()||'';if(kind!=='approve'&&!note){alert('Catatan wajib diisi saat meminta revisi atau menolak.');return}const x=load().find(z=>z.id===detail);if(!x||x.status!==role){alert('Status pengajuan telah berubah. Muat ulang data.');render();return}const msg={approve:'meneruskan pengajuan',revision:'meminta revisi pengajuan',reject:'menolak pengajuan'}[kind];if(!confirm(`Yakin ${msg} ${x.id}?`))return;const stage=x.status;const next=kind==='approve'?(stage==='direktur'?'approved':STAGES[STAGES.indexOf(stage)+1]):kind==='revision'?'revision':'rejected';x.status=next;x.updated=new Date().toISOString();if(next==='rejected')x.rejectedAt=stage;x.history.push({at:x.updated,by:roleName[role],name:currentName(),stage,action:kind==='approve'?'Setujui':kind==='revision'?'Minta Revisi':'Tolak',note});save(load().map(z=>z.id===x.id?x:z));render()}
function exportCSV(){const data=filtered();const rows=[['Nomor','Dibuat','Pemohon','Divisi','Judul','Tanggal Dibutuhkan','Total IDR','Status'],...data.map(x=>[x.id,x.created,x.requester,x.department,x.title,x.needed,totals(x),stageLabel(x.status)])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'TWA_Fund_Request_'+new Date().toISOString().slice(0,10)+'.csv')}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function settingsPage(){const c=cfg();return header('Pengaturan & Data','Personalisasi pengguna simulasi dan kelola backup data.')+`<div class="notice">Pengaturan ini hanya berlaku pada browser ini. Untuk operasional perusahaan, gunakan login akun individual dan database tersentralisasi dengan aturan akses di server.</div><section class="panel"><h2>Profil Simulasi</h2><div class="grid2">${['pemohon','kepala','finance','direktur'].map(r=>`<div class="field"><label>Nama ${roleName[r]}</label><input id="name_${r}" value="${escapeHtml(c.names?.[r]||'')}"></div>`).join('')}</div><div style="margin-top:15px"><button class="btn primary" onclick="saveConfig()">Simpan Nama Pengguna</button></div></section><section class="panel"><h2>Backup / Restore</h2><p class="muted">Data tersimpan dalam localStorage browser, bukan server bersama.</p><div class="flex" style="margin-top:14px"><button class="btn outline" onclick="backupJSON()">↓ Backup JSON</button><label class="btn outline" style="cursor:pointer">↑ Import JSON <input type="file" id="importJSON" accept=".json" style="display:none" onchange="importJSON(event)"></label><button class="btn danger" onclick="clearDemo()">Hapus Data Lokal</button></div></section>`}
function saveConfig(){const c=cfg();c.names={};['pemohon','kepala','finance','direktur'].forEach(r=>c.names[r]=document.getElementById('name_'+r).value.trim()||roleName[r]);localStorage.setItem(SETTINGS,JSON.stringify(c));alert('Pengaturan tersimpan.');render()}
function backupJSON(){downloadBlob(new Blob([JSON.stringify({requests:load(),settings:cfg(),exported:new Date().toISOString()},null,2)],{type:'application/json'}),'TWA_fund_request_backup.json')}
async function importJSON(e){const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.requests)||!data.requests.every(r=>r.id&&Array.isArray(r.items)&&Array.isArray(r.history))){throw Error('Format data tidak sesuai')}if(!confirm('Import akan MENGGANTI semua data lokal. Lanjutkan?'))return;save(data.requests);if(data.settings)localStorage.setItem(SETTINGS,JSON.stringify(data.settings));alert('Backup berhasil diimpor.');render()}catch(err){alert('Gagal import: '+err.message)}}
function clearDemo(){if(confirm('Hapus SELURUH pengajuan lokal? Tidak bisa dibatalkan tanpa backup.')&&confirm('Konfirmasi kedua: benar-benar hapus?')){localStorage.removeItem(STORE);render()}}
function showInfo(){alert('TRANSWISATA FUND REQUEST — PROTOTIPE HTML\n\nAlur: Staff → Kepala Bagian → Finance → Direktur.\nFinance memverifikasi lalu meneruskan, bukan approval final.\nKeputusan tercatat bersama waktu dan catatan.\n\nPENTING: versi demo menggunakan localStorage dan pilihan peran tanpa password. Tidak aman untuk operasional/approval resmi. Implementasi produksi membutuhkan Firebase Authentication, database, role-based security rules, dan audit log di server.')}
function togglePasswordVisibility(){const el=document.getElementById('loginPassword');const isHidden=el.type==='password';el.type=isHidden?'text':'password';document.getElementById('togglePassword').textContent=isHidden?'Sembunyi':'Lihat'}
function login(e){e.preventDefault();const username=document.getElementById('loginUsername').value.trim().toLowerCase();const password=document.getElementById('loginPassword').value;const account=ACCOUNTS[username];if(!account||password!==account.password){document.getElementById('loginError').textContent='Username atau password salah.';document.getElementById('loginPassword').value='';return false}loginUsername=username;role=account.role;sessionStorage.setItem(SESSION_KEY,username);document.getElementById('loginError').textContent='';document.getElementById('loginPassword').value='';document.getElementById('loginScreen').hidden=true;document.getElementById('appLayout').hidden=false;document.querySelector('header').hidden=false;page='dashboard';render();return false}
function logout(){loginUsername='';sessionStorage.removeItem(SESSION_KEY);document.getElementById('appLayout').hidden=true;document.querySelector('header').hidden=true;document.getElementById('loginScreen').hidden=false;document.getElementById('loginForm').reset();document.getElementById('loginError').textContent='';document.getElementById('loginUsername').focus()}
(function initAuth(){const remembered=sessionStorage.getItem(SESSION_KEY);if(remembered&&ACCOUNTS[remembered]){loginUsername=remembered;role=ACCOUNTS[remembered].role;document.getElementById('loginScreen').hidden=true;document.getElementById('appLayout').hidden=false;document.querySelector('header').hidden=false;render()}else{logout()}})();
</script></body></html>
