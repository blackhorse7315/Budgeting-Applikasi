 <div class="login-card">

<script>
'use strict';

// Preview-safe storage: the application remains interactive even when embedded previews
// restrict browser storage. Data persists normally when storage is available.
function obtainStorage(kind){
  try {
    const target=window[kind], test='__twa_preview_check__';
    target.setItem(test,'1');target.removeItem(test);
    return target;
  } catch(error){
    const cache=new Map();
    return {getItem:key=>cache.has(key)?cache.get(key):null,
      setItem:(key,value)=>cache.set(key,String(value)),
      removeItem:key=>cache.delete(key),clear:()=>cache.clear()};
  }
}
const storage=obtainStorage('localStorage');
const sessionStore=obtainStorage('sessionStorage');

const STORE='twa_fund_requests_v1', SETTINGS='twa_fund_settings_v1';
const STAGES=['kepala','finance','direktur'];const roleName={pemohon:'Pemohon',kepala:'Operation Manager',finance:'Finance',direktur:'Direktur',admin:'Admin'};
const DEFAULT_ACCOUNTS={user:{password:'usertranswisata',role:'pemohon',label:'Pemohon / Staff'},manops:{password:'manopstwa',role:'kepala',label:'Operation Manager'},finance:{password:'financetwa',role:'finance',label:'Finance'},dirut:{password:'diruttwa',role:'direktur',label:'Direktur'},admin:{password:'TWA119-021',role:'admin',label:'Administrator'}};
const ACCOUNTS_KEY='twa_fund_accounts_v2', PEOPLE_KEY='twa_fund_people_v2';
const accounts=()=>{try{const a=JSON.parse(storage.getItem(ACCOUNTS_KEY)||'null');return a&&typeof a==='object'?{...a,admin:DEFAULT_ACCOUNTS.admin}:structuredClone(DEFAULT_ACCOUNTS)}catch{return structuredClone(DEFAULT_ACCOUNTS)}};
const roster=()=>{try{const a=JSON.parse(storage.getItem(PEOPLE_KEY)||'null');return a&&typeof a==='object'?{pemohon:a.pemohon||[],kepala:a.kepala||[],finance:a.finance||[],direktur:a.direktur||[]}: {pemohon:[],kepala:[],finance:[],direktur:[]}}catch{return {pemohon:[],kepala:[],finance:[],direktur:[]}}};
const saveRoster=a=>storage.setItem(PEOPLE_KEY,JSON.stringify(a));
const accountByRole=r=>Object.entries(accounts()).find(([u,a])=>a.role===r)?.[0]||'';
const activeAccount=()=>accounts()[loginUsername];
const selectedPersonKey=r=>'twa_fund_person_'+r;
const chosenPerson=r=>(roster()[r]||[]).find(p=>p.id===storage.getItem(selectedPersonKey(r)))||(roster()[r]||[])[0]||null;
const personSelect=(r,selected='',id='personSelect',required=true)=>`<select id="${id}" ${required?'required':''}><option value="">— Pilih ${escapeHtml(roleName[r])} —</option>${roster()[r].map(p=>`<option value="${escapeHtml(p.id)}" ${p.id===selected?'selected':''}>${escapeHtml(p.name)} — ${escapeHtml(p.position)}</option>`).join('')}</select>`;
const snapshot=p=>p?{id:p.id,name:p.name,position:p.position,signature:p.signature||''}:null;

const SESSION_KEY='twa_fund_login_v2';let loginUsername='';
const statusName={draft:'Draft',kepala:'Menunggu Kepala Bagian',finance:'Menunggu Verifikasi Finance',direktur:'Menunggu Persetujuan Direktur',approved:'Disetujui Direktur',rejected:'Ditolak',revision:'Perlu Revisi'};
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
// All user-facing dates use DD Mon YYYY (e.g. 10 Oct 2026).
// A date-only ISO string is parsed as a calendar date, not as a UTC timestamp,
// to prevent the date shifting when opened in another timezone.
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function date(value,showTime=false){
  if(!value)return '—';
  const raw=String(value);
  const plain=/^(\d{4})-(\d{2})-(\d{2})$/.exec(raw);
  if(plain){const y=Number(plain[1]),m=Number(plain[2]),d=Number(plain[3]);const valid=new Date(y,m-1,d);return m>=1&&m<=12&&valid.getFullYear()===y&&valid.getMonth()===m-1&&valid.getDate()===d?`${String(d).padStart(2,'0')} ${MONTHS[m-1]} ${y}`:'—'}
  const parsed=new Date(raw);
  if(Number.isNaN(parsed.getTime()))return '—';
  const result=`${String(parsed.getDate()).padStart(2,'0')} ${MONTHS[parsed.getMonth()]} ${parsed.getFullYear()}`;
  return showTime?`${result}, ${String(parsed.getHours()).padStart(2,'0')}:${String(parsed.getMinutes()).padStart(2,'0')}`:result;
}
function syncNeededDate(){const input=document.getElementById('neededPicker'),display=document.getElementById('neededDisplay');if(input&&display)display.value=date(input.value)}
function openNeededPicker(){const input=document.getElementById('neededPicker');if(!input)return;try{if(input.showPicker)input.showPicker();else input.focus()}catch{input.focus();input.click()}}
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let role='pemohon',page='dashboard',filter='all',search='',editing=null,detail=null;
const load=()=>{try{return JSON.parse(storage.getItem(STORE)||'[]')}catch{return []}};
const save=a=>storage.setItem(STORE,JSON.stringify(a));
const cfg=()=>{try{return {...{company:'PT. Transwisata Prima Aviation',names:{pemohon:'Staff / Pemohon',kepala:'Operation Manager',finance:'Finance',direktur:'Direktur'}},...JSON.parse(storage.getItem(SETTINGS)||'{}')}}catch{return {company:'PT. Transwisata Prima Aviation',names:{pemohon:'Staff / Pemohon',kepala:'Operation Manager',finance:'Finance',direktur:'Direktur'}}}};
const currentName=()=>chosenPerson(role)?.name||(role==='pemohon'?(cfg().names?.pemohon||'Staff / Pemohon'):roleName[role]);
const totals=r=>(r.items||[]).reduce((a,x)=>a+(Number(x.qty)||0)*(Number(x.price)||0),0);
const stageLabel=s=>statusName[s]||s;
const badge=s=>`<span class="badge ${s==='approved'?'ok':s==='rejected'?'no':s==='revision'?'edit':'wait'}">${escapeHtml(stageLabel(s))}</span>`;
const generateId=()=>{const y=new Date().getFullYear();const ids=load().filter(x=>x.id.startsWith('FR-'+y+'-')).map(x=>Number(x.id.split('-').pop())||0);return `FR-${y}-${String(Math.max(0,...ids)+1).padStart(4,'0')}`};
function switchPage(p){if(!loginUsername)return;if(p==='new'&&role!=='pemohon')return;if(p==='settings'&&role!=='admin')return;if(p==='admin'&&role!=='admin')return;page=p;detail=null;editing=null;render()}
function navigateDetail(id){const x=load().find(z=>z.id===id);if(!x||(role==='pemohon'&&!ownsRequest(x))){alert('Pengajuan tidak dapat diakses.');return}detail=id;page='detail';render()}
function ownsRequest(x){return x.ownerUsername?x.ownerUsername===loginUsername:x.requester===currentName()}
function navActive(){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===(page==='detail'?'list':page)))}
function render(){if(!loginUsername)return;document.getElementById('signedInAs').textContent=activeAccount().label+' · '+loginUsername;document.querySelector('[data-page="new"]').hidden=role!=='pemohon';document.querySelector('[data-page="settings"]').hidden=role!=='admin';document.querySelector('[data-page="admin"]').hidden=role!=='admin';navActive();const main=document.getElementById('main');main.innerHTML=page==='dashboard'?dashboard():page==='list'?listPage():page==='new'?formPage():page==='detail'?detailPage():page==='admin'?adminPage():settingsPage();if(page==='new')bindForm();if(page==='list')bindList()}
const header=(title,desc,button=false)=>`<div class="topbar"><div><h1>${title}</h1><p class="muted">${desc}</p></div>${button&&role==='pemohon'?'<button class="btn primary no-print" onclick="switchPage(\'new\')">＋ Pengajuan Baru</button>':''}</div>`;
function dashboard(){const data=load(),pending=data.filter(x=>x.status===role),approved=data.filter(x=>x.status==='approved'),mine=role==='pemohon'?data.filter(ownsRequest):data;let stat=[['Total Pengajuan',mine.length],['Menunggu Tindakan',pending.length],['Disetujui',approved.length],['Nilai Dana Disetujui',money(approved.reduce((a,x)=>a+totals(x),0))]];
return header('Dashboard Approval',`Halo, ${escapeHtml(currentName())}. Pantau alur pengajuan dana.`,true)+`<div class="notice">Mode demo lokal: akun dan data hanya berlaku pada browser ini. Data belum tersinkronisasi antar perangkat. Untuk operasional resmi gunakan autentikasi dan persetujuan yang diverifikasi server.</div><div class="stats">${stat.map(([a,b])=>`<div class="stat"><div class="lbl">${a}</div><div class="num">${b}</div></div>`).join('')}</div><section class="panel"><div class="flex space"><h2>${role==='pemohon'?'Pengajuan Saya':role==='admin'?'Pengajuan Terbaru':'Menunggu Tindakan Saya'}</h2><button class="btn outline no-print" onclick="switchPage('list')">Lihat Semua</button></div>${table(role==='pemohon'?mine:role==='admin'?data:pending,7)}</section><section class="panel"><h2>Alur Persetujuan</h2><div class="timeline">${['Pemohon → Submit','1. Kepala Bagian','2. Finance (Cross-check)','3. Direktur (Final)'].map((x,i)=>`<div class="step"><strong>${x}</strong><span class="small muted">${['Buat pengajuan & rincian biaya','Tinjau urgensi dan kesesuaian kebutuhan','Verifikasi nominal, anggaran & dokumen','Approve / tolak keputusan akhir'][i]}</span></div>`).join('')}</div></section>`}
function table(rows,limit=0){const list=(limit?rows.slice(0,limit):rows);if(!list.length)return `<div class="empty">Belum ada pengajuan dalam kategori ini.</div>`;return `<div class="scroll"><table><thead><tr><th>No. Pengajuan</th><th>Tanggal</th><th>Judul / Keperluan</th><th>Pemohon</th><th>Total Dana</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${list.map(x=>`<tr><td><b class="code">${escapeHtml(x.id)}</b></td><td>${date(x.created,true)}</td><td><b>${escapeHtml(x.title)}</b><br><span class="small muted">${escapeHtml(x.department)}</span></td><td>${escapeHtml(x.requester)}</td><td><b>${money(totals(x))}</b></td><td>${badge(x.status)}</td><td><button class="btn" onclick="navigateDetail('${x.id}')">Detail →</button></td></tr>`).join('')}</tbody></table></div>`}
function listPage(){return header('Daftar Pengajuan','Cari, filter, dan proses seluruh permohonan dana.',true)+`<section class="panel"><div class="toolbar no-print"><input id="q" placeholder="Cari nomor, judul, pemohon..." value="${escapeHtml(search)}"><select id="filter"><option value="all">Semua Status</option>${Object.entries(statusName).map(([v,n])=>`<option value="${v}" ${filter===v?'selected':''}>${n}</option>`).join('')}</select><button class="btn outline" onclick="exportCSV()">↓ Export CSV</button></div><div id="listing">${table(filtered())}</div></section>`}
function filtered(){return load().filter(x=>(role!=='pemohon'||ownsRequest(x))&&(filter==='all'||x.status===filter)&&[x.id,x.title,x.requester,x.department].some(a=>String(a||'').toLowerCase().includes(search.toLowerCase())))}
function bindList(){document.getElementById('q').oninput=e=>{search=e.target.value;document.getElementById('listing').innerHTML=table(filtered())};document.getElementById('filter').onchange=e=>{filter=e.target.value;document.getElementById('listing').innerHTML=table(filtered())}}
function formPage(){const d=editing?load().find(x=>x.id===editing):null;return header(d?'Revisi Pengajuan':'Form Pengajuan Dana','Isi keperluan, rencana penggunaan dana, dan rincian biaya.')+`<form id="requestForm"><section class="panel"><h2>Informasi Pengajuan</h2><div class="grid2"><div class="field"><label>Nama Pemohon *</label>${personSelect('pemohon',d?.requesterPerson?.id||chosenPerson('pemohon')?.id||'','requesterPerson')}</div><div class="field"><label>Divisi / Bagian *</label><select name="department" required>${['','Operation','Maintenance','Finance','HRD & GA','Commercial','Management','Lainnya'].map(v=>`<option ${d?.department===v?'selected':''}>${escapeHtml(v)}</option>`).join('')}</select></div><div class="field full"><label>Judul / Keperluan Dana *</label><input name="title" required maxlength="180" placeholder="Contoh: Pembelian alat pendukung operasional" value="${escapeHtml(d?.title||'')}"></div><div class="field"><label>Tanggal Dana Dibutuhkan *</label><div class="date-picker-row"><input id="neededDisplay" type="text" readonly aria-label="Tanggal dana dibutuhkan (format 10 Oct 2026)" placeholder="10 Oct 2026"><button class="btn outline date-picker-btn" type="button" onclick="openNeededPicker()" aria-label="Pilih tanggal" title="Pilih tanggal">📅</button><input class="date-picker-native" id="neededPicker" type="date" name="needed" required value="${escapeHtml(d?.needed||[new Date().getFullYear(),String(new Date().getMonth()+1).padStart(2,'0'),String(new Date().getDate()).padStart(2,'0')].join('-'))}" onchange="syncNeededDate()" aria-label="Pilih tanggal melalui kalender"></div></div><div class="field"><label>Kategori</label><select name="category">${['Operasional','Maintenance','Training','Transportasi','Akomodasi','Pengadaan','Lainnya'].map(v=>`<option ${d?.category===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label>Penjelasan / Justifikasi *</label><textarea name="reason" required placeholder="Jelaskan kebutuhan, manfaat, lokasi, dan urgensi">${escapeHtml(d?.reason||'')}</textarea></div></div></section><section class="panel"><div class="flex space"><h2>Rincian Biaya</h2><button class="btn outline" type="button" onclick="addItem()">＋ Tambah Item</button></div><div class="items-head"><span>Uraian *</span><span>Qty *</span><span>Harga Satuan (IDR) *</span><span>Jumlah</span><span></span></div><div id="items"></div><div class="separator"></div><div class="flex space"><span class="muted">Total pengajuan dalam Rupiah</span><span class="total" id="grand">Rp0</span></div></section><section class="panel"><h2>Dokumen Pendukung</h2><div class="field"><label>Upload Lampiran (opsional, max 1 MB)</label><input id="upload" type="file" accept=".pdf,.jpg,.jpeg,.png"><small>Untuk demo lokal, satu lampiran kecil disimpan di browser; file yang lebih besar memerlukan storage server. ${d?.attachment?`Lampiran tersimpan: ${escapeHtml(d.attachment.name)}.`:''}</small></div></section><div class="flex no-print"><button class="btn primary" type="submit">${d?'Kirim Ulang Revisi':'Ajukan untuk Persetujuan'}</button><button type="button" class="btn outline" onclick="switchPage('list')">Batal</button></div></form>`}
function addItem(item={name:'',qty:1,price:0}){const el=document.createElement('div');el.className='itemrow';el.innerHTML=`<input class="itname" placeholder="Nama barang / biaya" required maxlength="180" value="${escapeHtml(item.name)}"><input class="itqty" type="number" min="0.01" step="0.01" required value="${Number(item.qty)||1}"><input class="itprice" type="number" min="0" step="1" required value="${Number(item.price)||0}"><input class="itsum" readonly aria-label="Jumlah item"><button type="button" class="remove" aria-label="Hapus item" title="Hapus item">×</button>`;el.querySelector('.remove').onclick=()=>{el.remove();calc()};el.querySelectorAll('input:not(.itsum)').forEach(x=>x.addEventListener('input',calc));document.getElementById('items').append(el);calc()}
function calc(){let total=0;document.querySelectorAll('.itemrow').forEach(r=>{const n=(Number(r.querySelector('.itqty').value)||0)*(Number(r.querySelector('.itprice').value)||0);r.querySelector('.itsum').value=money(n);total+=n});document.getElementById('grand').textContent=money(total)}
function bindForm(){const d=editing?load().find(x=>x.id===editing):null;if(!roster().pemohon.length){document.getElementById('requestForm').querySelector('button[type=submit]').disabled=true;document.getElementById('requestForm').insertAdjacentHTML('afterbegin','<div class="notice">Admin harus menambahkan Nama Pemohon dan jabatan pada Master Data sebelum pengajuan dapat dibuat.</div>')} (d?.items||[{name:'',qty:1,price:0}]).forEach(addItem);document.getElementById('requestForm').onsubmit=submitForm;syncNeededDate()}
async function submitForm(e){e.preventDefault();if(role!=='pemohon'||!loginUsername){alert('Hanya pemohon yang dapat mengajukan dana.');return;}const f=e.target,fd=new FormData(f),items=[...document.querySelectorAll('.itemrow')].map(r=>({name:r.querySelector('.itname').value.trim(),qty:Number(r.querySelector('.itqty').value),price:Number(r.querySelector('.itprice').value)}));if(!items.length||items.some(x=>!x.name||x.qty<=0||x.price<0)){alert('Masukkan setidaknya satu rincian biaya yang valid.');return}const requesterPerson=roster().pemohon.find(p=>p.id===document.getElementById('requesterPerson').value);if(!requesterPerson){alert('Pilih nama pemohon dari daftar yang disiapkan Admin.');return}storage.setItem(selectedPersonKey('pemohon'),requesterPerson.id);const old=editing?load().find(x=>x.id===editing):null;let att=old?.attachment||null;const file=document.getElementById('upload').files[0];if(file){if(file.size>1024*1024){alert('Lampiran melebihi 1 MB. Gunakan berkas lebih kecil pada versi demo.');return}att=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,data:reader.result});reader.onerror=reject;reader.readAsDataURL(file)})}const now=new Date().toISOString();const obj={...(old||{}),id:old?.id||generateId(),created:old?.created||now,updated:now,requester:requesterPerson.name,requesterPerson:snapshot(requesterPerson),ownerUsername:loginUsername,department:String(fd.get('department')),title:String(fd.get('title')).trim(),needed:String(fd.get('needed')),category:String(fd.get('category')),reason:String(fd.get('reason')).trim(),items,attachment:att,status:'kepala',history:[...(old?.history||[]),{at:now,by:roleName[role],name:currentName(),action:old?'Pengajuan diperbaiki & dikirim ulang':'Pengajuan dibuat & diajukan',note:''}]};const data=load();if(old){const i=data.findIndex(x=>x.id===old.id);data[i]=obj}else data.unshift(obj);try{save(data)}catch{alert('Penyimpanan browser penuh. Coba lampiran yang lebih kecil atau ekspor dan bersihkan data.');return}editing=null;navigateDetail(obj.id)}
function editRequest(id){if(role!=='pemohon')return;const x=load().find(z=>z.id===id);if(!x||x.status!=='revision'||!ownsRequest(x)){alert('Hanya pengajuan milik Anda yang berstatus Perlu Revisi yang dapat diubah.');return}editing=id;page='new';render()}
function timeline(x){let idx=STAGES.indexOf(x.status);return `<div class="timeline">${STAGES.map((s,i)=>{const h=(x.history||[]).some(y=>y.stage===s&&y.action==='Setujui');const state=x.status==='rejected'&&x.rejectedAt===s?'rejected':h?'done':x.status===s?'current':'';return `<div class="step ${state}"><strong>${i+1}. ${roleName[s]}</strong><span class="small">${state==='done'?'✓ Selesai':state==='current'?'● Menunggu tindakan':state==='rejected'?'✕ Ditolak':'Belum diproses'}</span></div>`}).join('')}<div class="step ${x.status==='approved'?'done':''}"><strong>4. Final</strong><span class="small">${x.status==='approved'?'✓ Approved':stageLabel(x.status)}</span></div></div>`}
function detailPage(){const x=load().find(r=>r.id===detail);if(!x)return `<div class="panel">Pengajuan tidak ditemukan. <button class="btn" onclick="switchPage('list')">Kembali</button></div>`;let can=role===x.status&&STAGES.includes(role);const canRev=x.status==='revision'&&role==='pemohon'&&ownsRequest(x);return header(`Pengajuan ${escapeHtml(x.id)}`,`Dibuat ${date(x.created,true)} · Terakhir diperbarui ${date(x.updated,true)}`)+`<section class="panel"><div class="flex space"><h2>${escapeHtml(x.title)}</h2>${badge(x.status)}</div>${timeline(x)}<div class="detailmeta"><div><span class="small muted">Pemohon</span><b>${escapeHtml(x.requester)}</b><span class="small muted">${escapeHtml(x.requesterPerson?.position||'')}</span></div><div><span class="small muted">Bagian / Divisi</span><b>${escapeHtml(x.department)}</b></div><div><span class="small muted">Tanggal Dibutuhkan</span><b>${date(x.needed)}</b></div><div><span class="small muted">Kategori</span><b>${escapeHtml(x.category)}</b></div><div><span class="small muted">Nominal Dana</span><b>${money(totals(x))}</b></div><div><span class="small muted">Status</span><b>${escapeHtml(stageLabel(x.status))}</b></div></div><div class="separator"></div><h3>Penjelasan Kebutuhan</h3><p style="white-space:pre-wrap">${escapeHtml(x.reason)}</p></section><section class="panel"><h2>Rincian Anggaran</h2><div class="scroll"><table><thead><tr><th>Uraian</th><th>Qty</th><th>Harga Satuan</th><th>Jumlah</th></tr></thead><tbody>${x.items.map(i=>`<tr><td>${escapeHtml(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td><b>${money(i.qty*i.price)}</b></td></tr>`).join('')}</tbody></table></div><div class="right total" style="padding-top:15px">Total: ${money(totals(x))}</div>${x.attachment?`<div class="separator"></div><a class="attachment" href="${x.attachment.data}" download="${escapeHtml(x.attachment.name)}">📎 ${escapeHtml(x.attachment.name)} (unduh lampiran)</a>`:''}</section><section class="panel"><h2>Riwayat & Audit Persetujuan</h2><div class="history">${(x.history||[]).slice().reverse().map(h=>`<div class="event"><b>${escapeHtml(h.action)}</b><div class="small muted">${date(h.at,true)} · ${escapeHtml(h.name)} (${escapeHtml(h.by)})</div>${h.note?`<p>${escapeHtml(h.note)}</p>`:''}</div>`).join('')}</div></section><section class="panel"><h2>Tanda Tangan / Persetujuan</h2>${signatureSummary(x)}</section>${can?`<section class="panel no-print"><h2>Keputusan ${roleName[role]}</h2><p class="muted">${role==='finance'?'Periksa rincian biaya, kesesuaian anggaran, dan bukti pendukung sebelum meneruskan ke Direktur.':'Tuliskan alasan atau catatan apabila diperlukan.'}</p><div class="field" style="margin:12px 0"><label>Nama Penandatangan / Pejabat *</label>${personSelect(role,chosenPerson(role)?.id||'','approverPerson')}</div><label class="field"><span>Catatan Persetujuan / Verifikasi</span><textarea id="decisionNote" placeholder="Contoh: Anggaran sesuai dan dokumen telah diverifikasi"></textarea></label><div class="flex" style="margin-top:12px"><button class="btn positive" onclick="decision('approve')">✓ ${role==='finance'?'Verifikasi & Teruskan':role==='direktur'?'Setujui Final':'Setujui & Teruskan'}</button><button class="btn outline" onclick="decision('revision')">↶ Minta Revisi</button><button class="btn danger" onclick="decision('reject')">✕ Tolak</button></div></section>`:''}${canRev?`<section class="panel no-print"><button class="btn primary" onclick="editRequest('${x.id}')">✎ Perbaiki & Ajukan Kembali</button></section>`:''}<div class="flex no-print" style="padding:4px 0 20px"><button class="btn outline" onclick="switchPage('list')">← Kembali</button><button class="btn outline" onclick="window.print()">⎙ Cetak / Simpan PDF</button></div>`}
function decision(kind){if(!loginUsername||!STAGES.includes(role))return;const note=document.getElementById('decisionNote')?.value.trim()||'';if(kind!=='approve'&&!note){alert('Catatan wajib diisi saat meminta revisi atau menolak.');return}const x=load().find(z=>z.id===detail);if(!x||x.status!==role){alert('Status pengajuan telah berubah. Muat ulang data.');render();return}const msg={approve:'meneruskan pengajuan',revision:'meminta revisi pengajuan',reject:'menolak pengajuan'}[kind];if(!confirm(`Yakin ${msg} ${x.id}?`))return;const approver=roster()[role].find(p=>p.id===document.getElementById('approverPerson')?.value);if(!approver){alert('Pilih nama pejabat dari daftar Admin terlebih dahulu.');return}storage.setItem(selectedPersonKey(role),approver.id);const stage=x.status;const next=kind==='approve'?(stage==='direktur'?'approved':STAGES[STAGES.indexOf(stage)+1]):kind==='revision'?'revision':'rejected';x.status=next;x.updated=new Date().toISOString();if(next==='rejected')x.rejectedAt=stage;x.history.push({at:x.updated,by:roleName[role],name:approver.name,position:approver.position,signature:approver.signature||'',stage,action:kind==='approve'?'Setujui':kind==='revision'?'Minta Revisi':'Tolak',note});save(load().map(z=>z.id===x.id?x:z));render()}
function signatureSummary(x){const entries=[{title:'Diajukan oleh',person:x.requesterPerson,done:true},...STAGES.map(r=>{const h=(x.history||[]).filter(h=>h.stage===r&&h.action==='Setujui').slice(-1)[0];return {title:r==='finance'?'Diverifikasi oleh':r==='direktur'?'Disetujui oleh':'Diketahui oleh',person:h?{name:h.name,position:h.position,signature:h.signature}:null,done:!!h}})];return `<div class="signature-grid">${entries.map(e=>`<div class="signature-box"><span>${escapeHtml(e.title)}</span>${e.done&&e.person?.signature?`<img src="${e.person.signature}" alt="Tanda tangan ${escapeHtml(e.person.name)}">`:'<div class="sig-gap"></div>'}<b>${escapeHtml(e.person?.name||'Menunggu persetujuan')}</b><span>${escapeHtml(e.person?.position||'—')}</span></div>`).join('')}</div><p class="small muted" style="margin-top:10px">Gambar tanda tangan ditampilkan dari arsip yang diunggah Admin. Pada versi lokal ini belum merupakan tanda tangan digital terverifikasi.</p>`}
function exportCSV(){const data=filtered();const rows=[['Nomor','Dibuat','Pemohon','Divisi','Judul','Tanggal Dibutuhkan','Total IDR','Status'],...data.map(x=>[x.id,date(x.created,true),x.requester,x.department,x.title,date(x.needed),totals(x),stageLabel(x.status)])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'TWA_Fund_Request_'+new Date().toISOString().slice(0,10)+'.csv')}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
let adminTab='pemohon';
function adminPage(){if(role!=='admin')return '<div class="notice">Akses ditolak.</div>';const r=adminTab,p=roster();return header('Admin — Master Data','Kelola daftar nama, jabatan, contoh tanda tangan, dan kredensial pengguna.')+`<div class="notice">Hanya akun Admin dapat membuka halaman ini. Seluruh data dan password masih tersimpan lokal pada browser; gunakan server dan autentikasi aman sebelum operasional resmi.</div><div class="admin-tabs">${['pemohon','kepala','finance','direktur','akun'].map(v=>`<button class="btn ${adminTab===v?'active':''}" onclick="setAdminTab('${v}')">${v==='akun'?'Akun & Password':roleName[v]}</button>`).join('')}</div>${r==='akun'?accountAdmin():`<section class="panel"><h2>Daftar ${roleName[r]}</h2><p class="muted">Masukkan nama lengkap dan jabatan, kemudian unggah tanda tangan PNG/JPG (maksimal 350 KB). Data ini digunakan pada formulir dan halaman persetujuan.</p><div class="admin-section">${p[r].length?p[r].map(person=>`<div class="person-card"><div class="person-body"><b>${escapeHtml(person.name)}</b><div class="muted small">${escapeHtml(person.position)}</div></div>${person.signature?`<img class="sig-preview" src="${person.signature}" alt="Tanda tangan ${escapeHtml(person.name)}">`:'<div class="sig-empty">Belum ada tanda tangan</div>'}<button class="btn outline" onclick="editPerson('${r}','${person.id}')">Edit</button><button class="btn danger" onclick="deletePerson('${r}','${person.id}')">Hapus</button></div>`).join(''):'<div class="empty">Belum ada nama. Tambahkan data melalui formulir di bawah.</div>'}</div></section><section class="panel"><h2 id="personFormTitle">Tambah ${roleName[r]}</h2><form id="personForm" onsubmit="return savePerson(event)"><input type="hidden" id="personId"><div class="admin-grid"><div class="field"><label>Nama Lengkap *</label><input id="personName" required maxlength="120" placeholder="Nama lengkap"></div><div class="field"><label>Jabatan / Posisi *</label><input id="personPosition" required maxlength="120" placeholder="Contoh: Operation Manager"></div></div><div class="field" style="margin-top:15px"><label>Upload Tanda Tangan (PNG/JPG, max 350 KB)</label><input id="personSignature" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewPersonSignature(event)"><div id="personSignaturePreview" style="margin-top:10px"></div><small>Disarankan gambar PNG dengan latar transparan. Jika mengedit dan tidak mengunggah file baru, tanda tangan sebelumnya tetap digunakan.</small></div><div class="flex" style="margin-top:15px"><button class="btn primary" type="submit">Simpan Data</button><button class="btn outline" type="button" onclick="resetPersonForm()">Batal / Reset</button></div></form></section>`}`}
function setAdminTab(r){if(role!=='admin')return;adminTab=r;render()}
function resetPersonForm(){const f=document.getElementById('personForm');if(!f)return;f.reset();document.getElementById('personId').value='';document.getElementById('personFormTitle').textContent='Tambah '+roleName[adminTab];document.getElementById('personSignaturePreview').innerHTML=''}
function editPerson(r,id){if(role!=='admin')return;const p=roster()[r].find(x=>x.id===id);if(!p)return;document.getElementById('personId').value=p.id;document.getElementById('personName').value=p.name;document.getElementById('personPosition').value=p.position;document.getElementById('personSignaturePreview').innerHTML=p.signature?`<img class="sig-preview" src="${p.signature}" alt="Tanda tangan tersimpan">`:'';document.getElementById('personFormTitle').textContent='Edit '+roleName[r];document.getElementById('personForm').scrollIntoView({behavior:'smooth',block:'center'})}
function previewPersonSignature(e){const f=e.target.files?.[0];if(!f)return;const target=document.getElementById('personSignaturePreview');target.textContent=f.name+' ('+Math.ceil(f.size/1024)+' KB)'}
async function savePerson(e){e.preventDefault();if(role!=='admin')return false;const r=adminTab,people=roster(),id=document.getElementById('personId').value,old=people[r].find(x=>x.id===id),name=document.getElementById('personName').value.trim(),position=document.getElementById('personPosition').value.trim(),f=document.getElementById('personSignature').files[0];if(!name||!position){alert('Nama dan jabatan wajib diisi.');return false}let signature=old?.signature||'';if(f){if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>350*1024){alert('Gunakan file gambar PNG/JPG/WEBP maksimal 350 KB.');return false}signature=await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(f)})}const person={id:old?.id||('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)),name,position,signature};if(old)people[r]=people[r].map(x=>x.id===id?person:x);else people[r].push(person);try{saveRoster(people)}catch{alert('Penyimpanan penuh. Perkecil ukuran gambar tanda tangan.');return false}render();return false}
function deletePerson(r,id){if(role!=='admin')return;const people=roster(),p=people[r].find(x=>x.id===id);if(!p||!confirm('Hapus '+p.name+' dari daftar '+roleName[r]+'? Riwayat persetujuan sebelumnya tetap tersimpan.'))return;people[r]=people[r].filter(x=>x.id!==id);saveRoster(people);render()}
function accountAdmin(){const a=accounts();return `<section class="panel"><h2>Ubah Username dan Password</h2><p class="muted">Pengaturan untuk Pemohon, Kepala Bagian (Operation Manager), Finance, dan Direktur. Akun Admin tetap menggunakan kredensial yang ditetapkan.</p><div class="admin-grid">${['pemohon','kepala','finance','direktur'].map(r=>{const u=accountByRole(r),acc=a[u];return `<form class="panel" style="margin:0" onsubmit="return saveAccount(event,'${r}')"><h3>${roleName[r]}</h3><div class="field"><label>Username</label><input id="accountUser_${r}" required maxlength="45" autocomplete="off" value="${escapeHtml(u)}" pattern="[A-Za-z0-9._-]+" title="Huruf, angka, titik, garis bawah, atau tanda minus"></div><div class="field" style="margin-top:10px"><label>Password Baru (kosongkan jika tidak diubah)</label><input id="accountPass_${r}" type="password" minlength="6" autocomplete="new-password" placeholder="Masukkan password baru"></div><label class="checkline small" style="margin-top:8px"><input type="checkbox" onchange="document.getElementById('accountPass_${r}').type=this.checked?'text':'password'"> Tampilkan password baru</label><button type="submit" class="btn primary" style="margin-top:12px">Simpan Akun ${roleName[r]}</button></form>`}).join('')}</div></section>`}
function saveAccount(e,r){e.preventDefault();if(role!=='admin')return false;const a=accounts(),old=accountByRole(r),username=document.getElementById('accountUser_'+r).value.trim().toLowerCase(),password=document.getElementById('accountPass_'+r).value;if(!/^[a-z0-9._-]{1,45}$/.test(username)){alert('Format username tidak valid.');return false}if(username==='admin'||(username!==old&&a[username])){alert('Username sudah digunakan atau dilindungi.');return false}if(password&&password.length<6){alert('Password minimal 6 karakter.');return false}const entry={...a[old],password:password||a[old].password};delete a[old];a[username]=entry;try{storage.setItem(ACCOUNTS_KEY,JSON.stringify(a));if(r==='pemohon'&&old!==username){save(load().map(x=>x.ownerUsername===old?{...x,ownerUsername:username}:x))}}catch{alert('Gagal menyimpan akun.');return false}alert('Akun '+roleName[r]+' berhasil diperbarui.');render();return false}
function settingsPage(){if(role!=='admin')return '<div class="notice">Akses ditolak.</div>';return header('Backup & Data','Ekspor data pengajuan dan daftar penandatangan.')+`<div class="notice">Backup dapat berisi gambar tanda tangan dan informasi pengajuan. Simpan file dengan aman. Username dan password tidak disertakan dalam backup.</div><section class="panel"><h2>Backup / Restore</h2><div class="flex" style="margin-top:14px"><button class="btn outline" onclick="backupJSON()">↓ Backup JSON</button><label class="btn outline" style="cursor:pointer">↑ Import JSON <input type="file" id="importJSON" accept=".json" style="display:none" onchange="importJSON(event)"></label><button class="btn danger" onclick="clearDemo()">Hapus Pengajuan Lokal</button></div></section>`}
function backupJSON(){downloadBlob(new Blob([JSON.stringify({requests:load(),settings:cfg(),people:roster(),exported:new Date().toISOString()},null,2)],{type:'application/json'}),'TWA_fund_request_backup.json')}
async function importJSON(e){const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.requests)||!data.requests.every(r=>r.id&&Array.isArray(r.items)&&Array.isArray(r.history))){throw Error('Format data tidak sesuai')}if(!confirm('Import akan MENGGANTI semua data lokal. Lanjutkan?'))return;save(data.requests);if(data.settings)storage.setItem(SETTINGS,JSON.stringify(data.settings));if(data.people&&typeof data.people==='object')saveRoster(data.people);alert('Backup berhasil diimpor.');render()}catch(err){alert('Gagal import: '+err.message)}}
function clearDemo(){if(confirm('Hapus SELURUH pengajuan lokal? Tidak bisa dibatalkan tanpa backup.')&&confirm('Konfirmasi kedua: benar-benar hapus?')){storage.removeItem(STORE);render()}}
function showInfo(){alert('TRANSWISATA FUND REQUEST — PROTOTIPE HTML\n\nAlur: Staff → Kepala Bagian → Finance → Direktur.\nFinance memverifikasi lalu meneruskan, bukan approval final.\nKeputusan tercatat bersama waktu dan catatan.\n\nPENTING: versi demo menggunakan storage dan pilihan peran tanpa password. Tidak aman untuk operasional/approval resmi. Implementasi produksi membutuhkan Firebase Authentication, database, role-based security rules, dan audit log di server.')}
function togglePasswordVisibility(){const el=document.getElementById('loginPassword');const isHidden=el.type==='password';el.type=isHidden?'text':'password';document.getElementById('togglePassword').textContent=isHidden?'Sembunyi':'Lihat'}
function login(e){e.preventDefault();const username=document.getElementById('loginUsername').value.trim().toLowerCase();const password=document.getElementById('loginPassword').value;const account=accounts()[username];if(!account||password!==account.password){document.getElementById('loginError').textContent='Username atau password salah.';document.getElementById('loginPassword').value='';return false}loginUsername=username;role=account.role;sessionStore.setItem(SESSION_KEY,username);document.getElementById('loginError').textContent='';document.getElementById('loginPassword').value='';document.getElementById('loginScreen').hidden=true;document.getElementById('appLayout').hidden=false;document.querySelector('header').hidden=false;page='dashboard';render();return false}
function logout(){loginUsername='';sessionStore.removeItem(SESSION_KEY);document.getElementById('appLayout').hidden=true;document.querySelector('header').hidden=true;document.getElementById('loginScreen').hidden=false;document.getElementById('loginForm').reset();document.getElementById('loginError').textContent='';document.getElementById('loginUsername').focus()}
(function initAuth(){const remembered=sessionStore.getItem(SESSION_KEY);if(remembered&&accounts()[remembered]){loginUsername=remembered;role=accounts()[remembered].role;document.getElementById('loginScreen').hidden=true;document.getElementById('appLayout').hidden=false;document.querySelector('header').hidden=false;render()}else{logout()}})();
</script></body></html>
